constraints:
- text: Never store personal data or paper content on a blockchain.
  _provenance:
    by: extracted
    source: docs/PRD.md
    confidence: 0.9
    span: No storage of personal data or paper content on a blockchain.
    needs_review: false
- text: Do not add a tradable token or token-weighted votes.
  _provenance:
    by: extracted
    source: docs/PRD.md
    confidence: 0.9
    span: No tradable token in scope. No token-weighted votes on scientific questions, ever.
    needs_review: false
- text: Never let AI review output change paper status, listing or reputation.
  _provenance:
    by: extracted
    source: docs/PRD.md
    confidence: 0.9
    span: Report is labelled advisory and cannot change status, listing or reputation
    needs_review: false
- text: Never hold a user's private signing key on the server.
  _provenance:
    by: extracted
    source: docs/PRD.md
    confidence: 0.9
    span: Account created in < 60 s; server holds no private key
    needs_review: false
- text: Process private drafts only with self-hosted models.
