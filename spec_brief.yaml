    by: extracted
    source: docs/PRD.md
    confidence: 0.9
    span: Private drafts are processed only by self-hosted models
    needs_review: false
- text: Run paper reproduction only in an isolated sandbox with no network.
  _provenance:
    by: extracted
    source: docs/PRD.md
    confidence: 0.9
    span: Reproduction runs in an isolated sandbox with no network
    needs_review: false
- text: Pass paper text to AI agents as quoted data, never concatenated into instructions.
  _provenance:
