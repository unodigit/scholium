# clamd configuration for the clamav service of compose.yaml.
#
# compose.yaml mounts this file read-only at /etc/clamav/clamd.conf, replacing the
# image's generated one, so it carries the lines the image's entrypoint and its
# clamdcheck.sh healthcheck rely on as well as the node's own choices. freshclam is
# not configured here: the image starts it as a daemon and it keeps the signatures
# on the clamav-db volume up to date.

# --- how the api and the worker reach clamd ------------------------------------------
#
# They send each bundle over TCP (CLAMD_SOCKET=clamav:3310). TCPAddr is left unset, so
# clamd listens on every interface of the container, which is the compose network: the
# service publishes no port on the host. clamd has no authentication; never publish it.
TCPSocket 3310

# The image's entrypoint waits for this socket before it reports clamd as started, so
# it must stay where the image puts it.
LocalSocket /run/clamav/clamd.sock

# The entrypoint starts clamd as root; clamd drops to this user.
User clamav

# Stay in the foreground (the container's process) and log to its output.
Foreground yes
LogTime yes

# --- size limits ---------------------------------------------------------------------
#
# 4000M is the largest value clamd accepts for each of these. A bundle may be up to
# the node's 5 GiB upload limit: one larger than this is answered with a size-limit
# error, which the node reports as "too large for the malware scan".
#
#   StreamMaxLength  most bytes one INSTREAM scan (how the node sends a bundle) takes
#   MaxScanSize      most data scanned from one file, archives unpacked
#   MaxFileSize      largest file (or archive member) scanned
StreamMaxLength 4000M
MaxScanSize 4000M
MaxFileSize 4000M
