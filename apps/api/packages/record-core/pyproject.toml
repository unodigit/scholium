[project]
name = "scholium-record-core"
version = "0.1.0"
description = "Scholium signed record core"
requires-python = ">=3.12"
dependencies = [
  "dag-cbor",
  "multiformats",
  "pynacl",
  "cryptography",
  "pydantic",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scholium_record_core"]

[tool.hatch.build.targets.wheel.force-include]
"schemas" = "scholium_record_core/record_schemas"