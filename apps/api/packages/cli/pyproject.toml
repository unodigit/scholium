[project]
name = "scholium-cli"
version = "0.1.0"
description = "Scholium CLI"
requires-python = ">=3.12"
dependencies = [
  "httpx",
]

[project.scripts]
scholium = "scholium_cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scholium_cli"]