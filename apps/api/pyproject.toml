[project]
name = "scholium-api"
version = "0.1.0"
description = "Scholium API"
requires-python = ">=3.12"
dependencies = [
  "fastapi",
  "sqlalchemy",
  "psycopg[binary]>=3.1",
  "pydantic",
  "pyjwt",
  "cryptography",
  "pynacl",
  "dag-cbor",
  "multiformats",
  "pypdf",
  "httpx",
  "boto3>=1.36",
  "anthropic",
  "pytest",
  "pytest-xdist",
  "uvicorn[standard]",
]

[tool.uv]
[tool.uv.workspace]
members = ["packages/*"]

[tool.pytest.ini_options]
# 4 workers keeps the default suite well under the agents' 2-minute command
# limit; exhaustive property sweeps are marked slow and run via `npm run test:slow`.
addopts = "-n 4 -m 'not slow'"
markers = ["slow: exhaustive sweeps excluded from the default run (npm run test:slow)"]
testpaths = ["src", "packages", "tests"]
pythonpath = ["src", "packages", "tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest", "pytest-xdist", "moto[s3]"]

[tool.hatch.build.targets.wheel]
packages = ["src/app"]