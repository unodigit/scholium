[project]
name = "scholium-api"
version = "0.1.0"
description = "Scholium API"
requires-python = ">=3.12"
dependencies = [
  "fastapi",
  "sqlalchemy",
  "psycopg[binary]>=3.1",
  "pydantic",
  "pyjwt",
  "cryptography",
  "pynacl",
  "dag-cbor",
  "multiformats",
  "pypdf",
  "httpx",
  "boto3>=1.36",
  "anthropic",
  "pytest",
  "pytest-xdist",
  "uvicorn[standard]",
]

[tool.uv]
[tool.uv.workspace]
members = ["packages/*"]

[tool.pytest.ini_options]
# Exhaustive property sweeps are marked slow (`npm run test:slow`) and the
# live checks are marked live_llm (`npm run test:llm-live`, which runs with
# -p no:xdist); neither runs in the default suite.
addopts = "-m 'not slow and not live_llm'"
markers = [
  "slow: exhaustive sweeps excluded from the default run (npm run test:slow)",
  "live_llm: opt-in checks against a real LLM endpoint (npm run test:llm-live)",
]
testpaths = ["src", "packages", "tests"]
pythonpath = ["src", "packages", "tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest", "pytest-xdist", "moto[s3]"]

[tool.hatch.build.targets.wheel]
packages = ["src/app"]