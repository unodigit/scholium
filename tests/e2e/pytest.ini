# End-to-end tests: real processes on real sockets, one test at a time.
#
#   npm run test:system                       everything (about three minutes)
#   npm run test:system -- -m "not web"       without the Next.js build (about two)
#   npm run test:system -- -k publish         extra arguments go to pytest
#
# Serial by default. Every module starts its own nodes (own ports, own data
# directories), so modules are independent and `-n 4 --dist loadfile` also works
# (about 45 seconds with -m "not web").
[pytest]
addopts = -ra -p no:cacheprovider
testpaths = .
markers =
    web: starts the Next.js web app (needs a production build, takes minutes); selected with -m web
