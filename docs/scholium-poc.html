<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scholium Journeys POC</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
<style>
/* Layout idea: journeys rail on the left, the working screen in the middle,
   and the live signed-record log as the "margin" on the right. */
:root{
  --bg:#FBFAF7; --surface:#FFFFFF; --ink:#1B1D22; --ink-2:#5A5F6B; --rule:#E4E1D9;
  --accent:#2F4BA0; --accent-ink:#FFFFFF; --accent-soft:#E9EDF8;
  --verified:#1F7A54; --verified-soft:#E3F2EB;
  --pending:#8A5F00; --pending-soft:#FBF1D6;
  --critical:#B3312B; --critical-soft:#FAE6E4;
  --ai:#6B4BA8; --ai-soft:#EFE9F8; --note:#FFF6D6;
  --serif:"Source Serif 4",Georgia,"Times New Roman",serif;
  --ui:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#14151A; --surface:#1C1E25; --ink:#ECEBE6; --ink-2:#A3A7B2; --rule:#2C2F38;
    --accent:#8FA6F0; --accent-ink:#14151A; --accent-soft:#232A42;
    --verified:#5CC79A; --verified-soft:#18302A;
    --pending:#E0B14A; --pending-soft:#33290F;
    --critical:#F08A84; --critical-soft:#3A1E1D;
    --ai:#B9A2F2; --ai-soft:#2A2340; --note:#3A3320;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#14151A; --surface:#1C1E25; --ink:#ECEBE6; --ink-2:#A3A7B2; --rule:#2C2F38;
  --accent:#8FA6F0; --accent-ink:#14151A; --accent-soft:#232A42;
  --verified:#5CC79A; --verified-soft:#18302A;
  --pending:#E0B14A; --pending-soft:#33290F;
  --critical:#F08A84; --critical-soft:#3A1E1D;
  --ai:#B9A2F2; --ai-soft:#2A2340; --note:#3A3320;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/22px var(--ui)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a{color:var(--accent)}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:12px;padding:12px 20px;border-bottom:1px solid var(--rule);background:var(--surface)}
.logo{font:600 20px/24px var(--serif);letter-spacing:.2px}
.logo span{color:var(--accent)}
.tag{font-size:12px;line-height:16px;padding:3px 8px;border:1px solid var(--rule);border-radius:999px;color:var(--ink-2)}
.top .grow{flex:1}
.shell{display:grid;grid-template-columns:230px minmax(0,1fr) 310px;gap:20px;padding:20px;max-width:1500px;margin:0 auto}
nav.rail{display:flex;flex-direction:column;gap:4px;align-self:start;position:sticky;top:12px}
.rail h2,.log h2{font:600 12px/16px var(--ui);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);margin:0 0 8px}
.jbtn{display:flex;gap:10px;align-items:center;width:100%;text-align:left;padding:8px 10px;border:1px solid transparent;border-radius:6px;background:none;cursor:pointer}
.jbtn:hover{background:var(--accent-soft)}
.jbtn[aria-current="true"]{background:var(--surface);border-color:var(--rule);font-weight:600}
.jnum{flex:none;width:22px;height:22px;border-radius:50%;border:1px solid var(--rule);display:grid;place-items:center;font:500 12px/1 var(--ui);color:var(--ink-2)}
.jbtn.done .jnum{background:var(--verified-soft);border-color:var(--verified);color:var(--verified)}
.jsub{display:block;font-size:12px;line-height:16px;color:var(--ink-2);font-weight:400}
.rail .reset{margin-top:12px}
main{min-width:0}
.jhead{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:baseline;margin-bottom:12px}
h1{font:600 26px/32px var(--serif);margin:0;text-wrap:balance}
.who{font-size:13px;color:var(--ink-2)}
.who b{color:var(--ink);font-weight:600}
.steps{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 16px;padding:0;list-style:none}
.steps li{font-size:12px;line-height:16px;padding:4px 10px;border-radius:999px;border:1px solid var(--rule);color:var(--ink-2);background:var(--surface)}
.steps li.cur{border-color:var(--accent);color:var(--accent);font-weight:600}
.steps li.ok{background:var(--verified-soft);border-color:transparent;color:var(--verified)}
.card{background:var(--surface);border:1px solid var(--rule);border-radius:10px;padding:20px}
.card + .card{margin-top:16px}
.card h3{font:600 18px/26px var(--serif);margin:0 0 8px;text-wrap:balance}
.card h4{font:600 13px/18px var(--ui);margin:16px 0 6px;color:var(--ink-2);text-transform:uppercase;letter-spacing:.06em}
p{margin:0 0 10px;max-width:68ch}
.read{font:18px/30px var(--serif);max-width:66ch}
.muted{color:var(--ink-2)}
.small{font-size:13px;line-height:18px}
.mono{font:13px/18px var(--mono);word-break:break-all}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.col{display:flex;flex-direction:column;gap:10px}
.split{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:16px}
.btn{padding:8px 14px;border-radius:6px;border:1px solid var(--rule);background:var(--surface);cursor:pointer;font-weight:500}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--critical);border-color:var(--critical)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.chip{display:inline-flex;align-items:center;gap:5px;font:500 12px/16px var(--ui);padding:3px 9px;border-radius:999px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.chip.ok{background:var(--verified-soft);color:var(--verified)}
.chip.pend{background:var(--pending-soft);color:var(--pending)}
.chip.bad{background:var(--critical-soft);color:var(--critical)}
.chip.ai{background:var(--ai-soft);color:var(--ai)}
.chip.plain{background:none;border:1px solid var(--rule);color:var(--ink-2)}
.idpill{font:13px/18px var(--mono);padding:2px 8px;border:1px solid var(--rule);border-radius:6px;background:var(--bg)}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--ink-2)}
input[type=text],select,textarea{background:var(--bg);border:1px solid var(--rule);border-radius:6px;padding:8px 10px;color:var(--ink);width:100%}
textarea{min-height:76px;resize:vertical}
.banner{padding:10px 14px;border-radius:6px;margin-bottom:12px;font-size:14px}
.banner.ok{background:var(--verified-soft);color:var(--verified)}
.banner.pend{background:var(--pending-soft);color:var(--pending)}
.banner.bad{background:var(--critical-soft);color:var(--critical)}
.banner.ai{background:var(--ai-soft);color:var(--ai)}
.banner.info{background:var(--accent-soft);color:var(--accent)}
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.list li{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;padding:9px 0;border-top:1px solid var(--rule)}
.list li:first-child{border-top:0}
.list .grow{flex:1;min-width:180px}
.check{display:grid;grid-template-columns:22px 1fr;gap:8px;padding:8px 0;border-top:1px solid var(--rule)}
.check:first-child{border-top:0}
.ic{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font:600 12px/1 var(--ui)}
.ic.pass{background:var(--verified-soft);color:var(--verified)}
.ic.fail{background:var(--critical-soft);color:var(--critical)}
.ic.pend{background:var(--pending-soft);color:var(--pending)}
.dots{display:inline-flex;gap:4px}
.dot{width:26px;height:26px;border-radius:50%;border:1px solid var(--rule);background:var(--bg);cursor:pointer;font:500 12px/1 var(--ui)}
.dot.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.rubric{display:grid;grid-template-columns:minmax(150px,220px) 1fr;gap:8px 14px;align-items:center}
.finding{border-left:3px solid var(--ai);padding:8px 12px;background:var(--ai-soft);border-radius:0 6px 6px 0}
.finding + .finding{margin-top:10px}
.quote{background:var(--note);padding:1px 4px;border-radius:3px}
.tamper{background:var(--critical-soft);color:var(--critical);padding:1px 4px;border-radius:3px}
.meter{display:inline-flex;gap:3px;vertical-align:middle}
.meter i{width:16px;height:8px;border-radius:2px;background:var(--rule)}
.meter i.on{background:var(--verified)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:8px 10px;border-top:1px solid var(--rule);vertical-align:top}
th{font:600 12px/16px var(--ui);color:var(--ink-2);text-transform:uppercase;letter-spacing:.06em;border-top:0}
.tw{overflow-x:auto}
aside.log{align-self:start;position:sticky;top:12px;background:var(--surface);border:1px solid var(--rule);border-radius:10px;padding:16px;max-height:calc(100vh - 110px);display:flex;flex-direction:column}
.log .entries{overflow:auto;display:flex;flex-direction:column;gap:8px;margin-top:10px}
.entry{border-left:2px solid var(--rule);padding:2px 0 2px 10px}
.entry.new{border-left-color:var(--accent)}
.entry .t{font:500 13px/18px var(--mono)}
.entry .m{font-size:12px;line-height:16px;color:var(--ink-2)}
.foot{margin-top:16px;font-size:12px;line-height:17px;color:var(--ink-2)}
.next{margin-top:16px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
@media (max-width:1180px){
  .shell{grid-template-columns:210px minmax(0,1fr)}
  aside.log{grid-column:1 / -1;position:static;max-height:420px}
}
@media (max-width:760px){
  .shell{grid-template-columns:minmax(0,1fr);padding:16px}
  nav.rail{position:static;flex-direction:row;overflow-x:auto;padding-bottom:6px}
  .rail h2,.rail .reset,.jsub{display:none}
  .jbtn{width:auto;white-space:nowrap;border-color:var(--rule)}
  .split{grid-template-columns:minmax(0,1fr)}
  .rubric{grid-template-columns:minmax(0,1fr)}
}
@media (prefers-reduced-motion:no-preference){.entry.new{transition:border-color .2s ease-out}}
</style>
</head>
<body>
<header class="top">
  <div class="logo">scholium<span>.</span></div>
  <span class="tag">Proof-of-concept prototype</span>
  <span class="tag">Demo data, fictional people</span>
  <span class="grow"></span>
  <span class="small muted">Hashes are real SHA-256. Signatures, sign-ins, storage and the chain are simulated in your browser.</span>
</header>
<div class="shell">
  <nav class="rail" id="rail" aria-label="User journeys"></nav>
  <main id="main"></main>
  <aside class="log" id="log" aria-label="Signed record log"></aside>
</div>
<script>
"use strict";
/* ---------- crypto helpers (real SHA-256, synchronous) ---------- */
const K256=[],H256=[];
(function(){let n=2,c=0;const fr=x=>((x-Math.floor(x))*4294967296)>>>0;
  while(c<64){let p=true;for(let i=2;i*i<=n;i++)if(n%i===0){p=false;break}
    if(p){if(c<8)H256[c]=fr(Math.sqrt(n));K256[c]=fr(Math.cbrt(n));c++}n++}})();
function sha256Bytes(b){
  const l=b.length,tot=((l+9+63)>>6)<<6,buf=new Uint8Array(tot);buf.set(b);buf[l]=0x80;
  const dv=new DataView(buf.buffer);dv.setUint32(tot-8,Math.floor(l/536870912));dv.setUint32(tot-4,(l*8)>>>0);
  const h=H256.slice(),w=new Uint32Array(64),rr=(x,n)=>(x>>>n)|(x<<(32-n));
  for(let o=0;o<tot;o+=64){
    for(let i=0;i<16;i++)w[i]=dv.getUint32(o+i*4);
    for(let i=16;i<64;i++){const a=w[i-15],d=w[i-2];
      w[i]=(w[i-16]+(rr(a,7)^rr(a,18)^(a>>>3))+w[i-7]+(rr(d,17)^rr(d,19)^(d>>>10)))>>>0}
    let [a,bb,c,d,e,f,g,hh]=h;
    for(let i=0;i<64;i++){
      const t1=(hh+(rr(e,6)^rr(e,11)^rr(e,25))+((e&f)^(~e&g))+K256[i]+w[i])>>>0;
      const t2=((rr(a,2)^rr(a,13)^rr(a,22))+((a&bb)^(a&c)^(bb&c)))>>>0;
      hh=g;g=f;f=e;e=(d+t1)>>>0;d=c;c=bb;bb=a;a=(t1+t2)>>>0}
    h[0]=(h[0]+a)>>>0;h[1]=(h[1]+bb)>>>0;h[2]=(h[2]+c)>>>0;h[3]=(h[3]+d)>>>0;
    h[4]=(h[4]+e)>>>0;h[5]=(h[5]+f)>>>0;h[6]=(h[6]+g)>>>0;h[7]=(h[7]+hh)>>>0}
  return h.map(x=>x.toString(16).padStart(8,"0")).join("")}
const sha256=s=>sha256Bytes(new TextEncoder().encode(s));
const canon=o=>Array.isArray(o)?"["+o.map(canon).join(",")+"]":
  (o&&typeof o==="object")?"{"+Object.keys(o).sort().map(k=>JSON.stringify(k)+":"+canon(o[k])).join(",")+"}":JSON.stringify(o===undefined?null:o);
const merkle=ids=>{if(!ids.length)return sha256("");let L=ids.slice();
  while(L.length>1){const N=[];for(let i=0;i<L.length;i+=2)N.push(sha256(L[i]+(L[i+1]||L[i])));L=N}return L[0]};

/* ---------- people (all fictional) ---------- */
const PEOPLE={
  mei:{name:"Mei Zhang",role:"Author, PhD student"},
  rafael:{name:"Rafael Silva",role:"Co-author"},
  lena:{name:"Lena Haddad",role:"Co-author"},
  okafor:{name:"Dr. Tunde Okafor",role:"Reviewer, cs.AI"},
  revA:{name:"Reviewer A",role:"Anonymous reviewer key"},
  sam:{name:"Sam Rivera",role:"Reader, ML engineer"},
  priya:{name:"Priya Nair",role:"Moderator, cs.AI"},
  library:{name:"Harbour University Library",role:"Archive node operator"},
  committee:{name:"Integrity committee",role:"3-of-5 threshold key"},
  node:{name:"Scholium node (Sydney)",role:"Node key"},
  orcid:{name:"ORCID issuer (simulated)",role:"Credential issuer"},
  guardians:{name:"Recovery guardians",role:"3 of 5"},
  assembly:{name:"Members' assembly",role:"Governance"}
};
const did=k=>"did:key:z"+sha256("scholium-poc:"+k).slice(0,22);
const nm=k=>PEOPLE[k]?PEOPLE[k].name:k;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const short=h=>h.slice(0,10)+"…";

/* ---------- state ---------- */
let S;
const hashOf=r=>sha256(canon({v:r.v,type:r.type,author:r.author,prev:r.prev,body:r.body}));
const sigOf=(by,id)=>"sim-"+sha256(by+"|"+id).slice(0,16);
function rec(type,by,body,prev){
  const r={v:1,type,author:did(by),prev:prev||null,body};
  r.id=hashOf(r);r.sig=sigOf(by,r.id);r.by=by;r.t=Date.now();r.batch=null;
  S.log.push(r);S.fresh=r.id;return r}
const R=id=>S.log.find(r=>r.id===id);
function anchor(){
  const ids=S.log.filter(r=>r.batch===null).map(r=>r.id);if(!ids.length)return null;
  const a={seq:S.anchors.length+1,root:merkle(ids),ids,t:Date.now()};
  S.anchors.push(a);S.log.forEach(r=>{if(r.batch===null)r.batch=a.seq});return a}
const demoFiles=(pk)=>[["paper.pdf","1.8 MB","pdf"],["source.tar.gz","420 KB","source"],["code.zip","6.1 MB","code"]]
  .map(([path,size,role])=>({path,size,role,fp:sha256("demo-file:"+pk+":"+path)}));
const shortId=p=>{const g=p.genesis;return "sch:"+g.slice(0,4)+"-"+g.slice(4,8)+"-"+g.slice(8,12)};
const JOURNEYS=["onboard","publish","moderate","review","ai-review","verify","preserve","dispute","recover","govern"];

function addVersion(pk,by,fields){
  const p=S.papers[pk],n=p.versions.length+1,prev=n>1?p.versions[n-2]:p.genesis;
  const man=rec("manifest",by,{files:p.files.map(f=>({path:f.path,fp:f.fp,role:f.role}))});
  const v=rec("paper.version",by,Object.assign({paper:p.genesis,n,authors:p.authors.map(did),manifest:man.id,licence:p.licence},fields),prev);
  p.versions.push(v.id);return v}
function newPaper(pk,by,authors,fields,files,licence,cats){
  const g=rec("paper.genesis",by,{seed:pk+":"+fields.title,authors:authors.map(did),categories:cats,licence});
  S.papers[pk]={key:pk,genesis:g.id,authors,versions:[],files,licence,cats,mod:"queue",consents:{},flag:null,correction:null,retracted:false};
  return addVersion(pk,by,fields)}
function consent(pk,who){const p=S.papers[pk],v=p.versions[p.versions.length-1];
  rec("coauthor.consent",who,{version:v,role:"author"});(p.consents[v]=p.consents[v]||[]).push(who)}

function init(){
  S={j:"onboard",st:{},log:[],anchors:[],papers:{},fresh:null,
    user:{passkey:false,orcid:false,cats:{"cs.AI":true,"cs.LG":false,"cs.MA":true,"stat.ML":false},guardians:false,endorsed:false},
    sub:{files:[],title:"Sparse Probing of Reward Models",abstract:"We study whether sparse linear probes can recover the features a learned reward model relies on, and show where they fail under distribution shift.",cat:"cs.LG",licence:"CC BY 4.0",checks:false,note:""},
    mod:{pick:null,action:"list",clause:"1.1 In scope and scholarly form",reason:"",done:{},appeal:null},
    rev:{anon:true,scores:{},rec:"",text:"",dup:false,reply:"",updated:false},
    ai:{state:{},inj:false},
    ver:{pk:"p1",abs:false,pdf:false,res:null},
    nodeS:{boot:null,reps:[
      {name:"Scholium Sydney (hot)",op:"NextGenius",jur:"AU",up:true,fails:0},
      {name:"Harbour University Library",op:"Harbour University",jur:"AU",up:true,fails:0},
      {name:"Nordlys Archive",op:"Nordlys Foundation",jur:"NO",up:true,fails:0},
      {name:"Alpine Research Mirror",op:"Alpine Research Trust",jur:"CH",up:true,fails:0},
      {name:"Cold storage deal",op:"Public storage network",jur:"n/a",up:true,fails:0}]},
    dis:{text:"Figures 3 and 5 appear to show the same plot with different axis labels.",resp:"Figure 5 was exported from the wrong notebook. The corrected figure and its data are attached in v-next.",outcome:"Correction required",reasons:"Honest error, promptly corrected by the authors. No evidence of fabrication."},
    rcv:{ok:[false,false,false,false,false],old:false},
    gov:{vote:null},
    policy:{revealDays:21,minReplicas:5}};
  JOURNEYS.forEach(j=>S.st[j]=0);
  /* seeded paper p1 */
  newPaper("p1","mei",["mei","rafael","lena"],
    {title:"Can a Meta-Agent Choose the Safer Branch?",
     abstract:"We propose an evaluation framework that tests whether a meta-agent can identify the safer of two decision branches when the reward signal is adversarially shaped.",
     changeNote:"Initial version"},demoFiles("p1"),"CC BY 4.0",["cs.AI","cs.MA"]);
  consent("p1","rafael");consent("p1","lena");
  rec("moderation.decision","priya",{target:S.papers.p1.versions[0],action:"list",clause:"1.1 In scope and scholarly form"});
  S.papers.p1.mod="listed";
  rec("ai.review","node",{target:S.papers.p1.versions[0],agents:["methodology","literature","reproducibility","integrity","meta"],promptSet:sha256("prompt-set-v1").slice(0,16)});
  S.sealedA={scores:{Soundness:4,Evidence:3,Reproducibility:4,Novelty:3,Clarity:4,Limitations:3},rec:"Sound with minor revisions",
    text:"The framework is well motivated. The adversarial baseline in Section 4 needs a clearer definition, and the limitations section should discuss reward models that are not differentiable.",salt:"a7c1"};
  rec("review.commit","revA",{target:S.papers.p1.versions[0],commitment:sha256(canon(S.sealedA)),nullifier:sha256("revA-secret|"+S.papers.p1.genesis).slice(0,24)});
  S.reviews=[];S.revealed=false;
  /* an out-of-scope item for the moderation queue */
  newPaper("px","sam",["sam"],{title:"A Perpetual-Motion Optimizer That Needs No Gradient",abstract:"We claim an optimizer that reduces loss without computing anything.",changeNote:"Initial version"},demoFiles("px"),"CC BY 4.0",["cs.AI"]);
  anchor();S.fresh=null}

/* ---------- derived ---------- */
const REC=["Sound as is","Sound with minor revisions","Major concerns","Fundamentally flawed"];
function status(pk){const p=S.papers[pk];
  if(p.retracted)return ["bad","Retracted"];
  if(p.mod==="rejected")return ["bad","Not listed"];
  if(p.mod!=="listed")return ["pend","In moderation"];
  let s=["plain","Preprint"];
  if(pk==="p1"){
    if(S.revealed){const r=S.reviews.map(x=>REC.indexOf(x.rec)).sort((a,b)=>a-b),med=(r[0]+r[r.length-1])/2;
      s=(med<=1&&!(p.flag&&!p.correction))?["ok","Reviewed ("+S.reviews.length+")"]:["pend","Under review ("+S.reviews.length+")"]}
    else s=["pend","Under review (sealed)"]}
  if(p.correction)s=["pend","Corrected · "+s[1]];
  return s}
const upReps=()=>S.nodeS.reps.filter(r=>r.fails<3);
function served(pk){const p=S.papers[pk];
  return p.versions.map((id,i)=>{const r=R(id),c={v:r.v,type:r.type,author:r.author,prev:r.prev,body:Object.assign({},r.body),id:r.id,sig:r.sig,by:r.by};
    if(S.ver.abs&&pk===S.ver.pk&&i===0)c.body.abstract=c.body.abstract.replace(/\.$/,"")+", and it always succeeds.";return c})}
function verifyPaper(pk){
  const p=S.papers[pk],vs=served(pk),out=[],add=(ok,label,detail)=>out.push({ok,label,detail});
  let sig=true,miss=[];
  vs.forEach(v=>{if(v.sig!==sigOf(v.by,v.id))sig=false;
    p.authors.filter(a=>a!==v.by).forEach(a=>{if(!(p.consents[v.id]||[]).includes(a))miss.push(nm(a)+" (v"+v.body.n+")")})});
  add(sig&&!miss.length?"pass":"fail",sig&&!miss.length?"Signed by all "+p.authors.length+" listed authors":"Missing author signatures",miss.length?"No consent from: "+miss.join(", "):"Signatures are simulated in this prototype");
  let chain=true,why="";
  vs.forEach((v,i)=>{if(hashOf(v)!==v.id){chain=false;why="Version "+v.body.n+" does not match the fingerprint its authors signed"}
    const want=i?p.versions[i-1]:p.genesis;if(v.prev!==want){chain=false;why="Version "+v.body.n+" does not link to the version before it"}});
  add(chain?"pass":"fail",chain?"Version history is intact ("+vs.map(v=>"v"+v.body.n).join(" → ")+")":"Version history is broken",why||"Each version's SHA-256 fingerprint was recomputed just now");
  const man=R(vs[vs.length-1].body.manifest),bad=p.files.filter((f,i)=>{const fp=(S.ver.pdf&&pk===S.ver.pk&&f.path==="paper.pdf")?sha256("swapped"):f.fp;return fp!==man.body.files[i].fp});
  add(bad.length?"fail":"pass",bad.length?"A served file differs from what was signed":"Files match what the authors signed ("+p.files.length+" files)",bad.length?bad.map(f=>f.path).join(", ")+" has a different fingerprint":"Compared against the signed manifest");
  const anch=vs.map(v=>S.anchors.find(a=>a.ids.includes(v.id)));
  if(anch.every(Boolean)){const good=anch.every(a=>merkle(a.ids)===a.root);
    add(good?"pass":"fail",good?"Timestamp anchored: "+new Date(anch[anch.length-1].t).toLocaleString():"Anchor root does not match",good?"Batch "+anch.map(a=>a.seq).join(", ")+"; root recomputed from "+anch[anch.length-1].ids.length+" records":"")}
  else add("pend","Signed. The public timestamp will be added with the next batch","Use Anchor batch now in the record log");
  add(p.retracted?"fail":"pass",p.retracted?"This paper has been retracted":p.correction?"A correction is on record":"No retraction or correction on record",p.correction?"The correction is linked from every version":"");
  const up=upReps().length;
  add(up>=S.policy.minReplicas?"pass":"pend","Preservation: "+up+" of "+S.policy.minReplicas+" replicas",new Set(upReps().map(r=>r.op)).size+" operators");
  const overall=out.some(c=>c.ok==="fail")?"fail":out.some(c=>c.ok==="pend")?"pend":"pass";
  return {out,overall}}

  const bn={pass:["ok","Verified in your browser"],pend:["pend","Signed. Some checks are still pending"],fail:["bad","Verification failed. Do not rely on this copy. Try another node."]};
  return `<div class="split"><div class="card">
    ${listed.length>1?`<div class="row" style="margin-bottom:10px">${listed.map(k=>`<button class="btn ${k===V.pk?"pri":""}" data-a="ver-open" data-d="${k}">${shortId(S.papers[k])}</button>`).join("")}</div>`:""}
    ${p.correction?`<div class="banner pend">Corrected: ${esc(p.correction)}</div>`:""}
    ${paperHead(V.pk,false)}
    <h4>Abstract as served${sv.length>1?" (version 1)":""}</h4>
    <p class="read">${V.abs?esc(orig.replace(/\.$/,""))+`<span class="tamper">, and it always succeeds.</span>`:esc(ab)}</p>
    <h4>Files</h4><ul class="list">${p.files.map(f=>`<li><span class="grow">${esc(f.path)} <span class="small muted">${esc(f.size)}</span></span>${V.pdf&&f.path==="paper.pdf"?chip("bad","Swapped"):""}</li>`).join("")}</ul>
    <h4>Play the attacker</h4><p class="small muted">Pretend a server or a network attacker changes what readers receive.</p>
    <div class="row">${btn(V.abs?"Restore the abstract":"Alter the abstract","ver-abs",V.abs?"":"danger")}${btn(V.pdf?"Restore the PDF":"Swap the PDF","ver-pdf",V.pdf?"":"danger")}</div></div>
   <div class="card"><h3>Proof</h3>
    ${res?`<div class="banner ${bn[res.overall][0]}">${bn[res.overall][1]}</div>${checks(res.out)}
      <h4>Technical details</h4><p class="mono muted">version ${last.id}</p><p class="mono muted">manifest ${last.body.manifest}</p>`
      :`<p>Nothing here is taken on trust. Your browser recomputes every fingerprint and follows the chain back to the first version.</p>`}
    <div class="next">${btn(res?"Re-run check":"Run verification","ver-run","pri")}${go("preserve","Next journey: preserve")}</div></div></div>`}};

J.preserve={title:"Preserve the archive",sub:"Run a node, survive failure",steps:["Bootstrap","Replicas","Failure drill"],who:()=>"library",
 view(s){const n=S.nodeS,up=upReps(),down=n.reps.find(r=>!r.up&&r.fails<3);
  const tbl=`<div class="tw"><table><tr><th>Replica</th><th>Operator</th><th>Jurisdiction</th><th>Last probe</th></tr>${n.reps.map(r=>`<tr><td>${esc(r.name)}</td><td>${esc(r.op)}</td><td>${r.jur}</td>
    <td>${r.fails>=3?chip("bad","Dropped after 3 failed probes"):r.up?chip("ok","Passed"):chip("pend","Failed "+r.fails+" of 3")}</td></tr>`).join("")}</table></div>`;
  if(s===0)return `<div class="card"><h3>Start an archive node from a snapshot</h3>
    <p>A new node needs no permission from the founding operator. It downloads a snapshot from any peer and checks every record itself.</p>
    ${n.boot?`<div class="banner ${n.boot.bad?"bad":"ok"}">${n.boot.ok} of ${n.boot.total} records verified. ${n.boot.batches} anchor batch(es) recomputed and matched${n.boot.pending?", "+n.boot.pending+" record(s) awaiting the next anchor":""}.</div>
      <div class="next">${btn("Continue","nd-next","pri")}</div>`:btn("Bootstrap from snapshot","nd-boot","pri")}</div>`;
  return `<div class="card"><h3>Replication health</h3>
    <div class="row"><b>${up.length} of ${S.policy.minReplicas} replicas</b>${meter(up.length,Math.max(S.policy.minReplicas,up.length))}
      ${chip(up.length>=S.policy.minReplicas?"ok":"pend",up.length>=S.policy.minReplicas?"Fully preserved":"Below policy")}
      <span class="small muted">${new Set(up.map(r=>r.op)).size} operators · ${new Set(up.map(r=>r.jur).filter(j=>j!=="n/a")).size} jurisdictions</span></div>
    <div style="margin-top:12px">${tbl}</div>
    ${s===1?`<div class="next">${btn("Start the failure drill","nd-next","pri")}</div>`:`<h4>Failure drill</h4>
      <div class="row">${btn("Simulate an outage at Nordlys Archive","nd-fail","danger",n.reps[2].up?"":"disabled")}
      ${btn("Run availability probe","nd-probe","",down?"":"disabled")}
      ${btn("Re-replicate to a new operator","nd-rerep","pri",up.length<S.policy.minReplicas?"":"disabled")}</div>
      <p class="small muted" style="margin-top:10px">Each probe asks a replica for random byte ranges and checks them against the signed fingerprints. Three failures drop the replica and trigger re-replication.</p>
      <div class="next">${go("dispute","Next journey: handle a dispute")}</div>`}</div>`}};

J.dispute={title:"Handle an integrity dispute",sub:"Flag, due process, correction",steps:["Flag","Case opened","Author responds","Decision","Correction shown"],
 who:s=>s===0?"sam":s===2?"mei":"committee",
 view(s){const d=S.dis;
  if(s===0)return `<div class="card">${paperHead("p1",false)}<h4>Report a concern</h4>
    <label class="f" for="ds-text">What did you notice?<textarea id="ds-text" data-b="dis.text">${esc(d.text)}</textarea></label>
    <div class="next">${btn("Submit flag","ds-flag","pri")}</div></div>`;
  if(s===1)return `<div class="card"><h3>Flag received</h3><p>${esc(d.text)}</p>
    <div class="finding">${chip("ai","Integrity agent")}<p style="margin:6px 0">Needs a human check: Figures 3 and 5 look near-identical. This is not an accusation.</p></div>
    <p class="small muted" style="margin-top:10px">A flag changes nobody's reputation. Only a concluded case can, after the author has been heard.</p>
    <div class="next">${btn("Open a case","ds-open","pri")}</div></div>`;
  if(s===2)return `<div class="card col"><h3>You have been asked to respond</h3><p>${esc(d.text)}</p>
    <label class="f" for="ds-resp">Your response<textarea id="ds-resp" data-b="dis.resp">${esc(d.resp)}</textarea></label>
    <div>${btn("Send response","ds-resp","pri")}</div></div>`;
  if(s===3)return `<div class="card col"><h3>Committee decision</h3><p><b>Concern:</b> ${esc(d.text)}</p><p><b>Author:</b> ${esc(d.resp)}</p>
    <label class="f" for="ds-out">Outcome<select id="ds-out" data-b="dis.outcome">${["Correction required","No action","Retraction"].map(o=>`<option ${o===d.outcome?"selected":""}>${o}</option>`).join("")}</select></label>
    <label class="f" for="ds-rs">Published reasons<textarea id="ds-rs" data-b="dis.reasons">${esc(d.reasons)}</textarea></label>
    <div>${btn("Sign with 3 of 5 committee keys","ds-decide","pri")}</div></div>`;
  const p=S.papers.p1;
  return `<div class="card">${p.retracted?`<div class="banner bad">Retracted by the integrity committee. ${esc(d.reasons)}</div>`:p.correction?`<div class="banner pend">Corrected: ${esc(p.correction)}</div>`:`<div class="banner ok">Case closed with no action. ${esc(d.reasons)}</div>`}
    ${paperHead("p1")}<p class="small muted">The banner appears on every version, in search results and in citation exports. The decision can be appealed once to a randomly drawn panel.</p>
    <div class="next">${go("recover","Next journey: recover a lost key")}</div></div>`}};

J.recover={title:"Recover a lost key",sub:"Guardians, safety window",steps:["Lost device","Guardian approvals","Safety window","New passkey"],who:()=>"mei",
 view(s){const r=S.rcv,n=r.ok.filter(Boolean).length,G=["Rafael Silva","Lena Haddad","Dr. Tunde Okafor","Harbour University identity desk","ORCID-verified email"];
  if(s===0)return `<div class="card"><h3>Lost your device?</h3><p>Your papers and reviews stay yours. Three of your five guardians can approve a new key.</p>${btn("Start recovery","rc-next","pri")}</div>`;
  if(s===1)return `<div class="card"><h3>Guardian approvals: ${n} of 3</h3><ul class="list">${G.map((g,i)=>`<li><span class="grow">${g}</span>${r.ok[i]?chip("ok","Approved"):btn("Approve (demo)","rc-ok","",`data-d="${i}"`)}</li>`).join("")}</ul>
    <div class="next">${btn("Continue","rc-next","pri",n>=3?"":"disabled")}</div></div>`;
  if(s===2)return `<div class="card"><h3>72-hour safety window</h3><p>A cancel link went to every contact on the account. If this recovery was not you, one click stops it.</p>
    <div class="banner pend">The new key becomes active when the window ends.</div>${btn("Skip 72 hours (demo)","rc-next","pri")}</div>`;
  return `<div class="card"><h3>${r.done?"New key active":"Create your new passkey"}</h3>
    ${r.done?`<div class="banner ok">A key rotation record links your old identity to the new key. All earlier papers and reviews still verify.</div>
      ${r.old?`<div class="banner bad">Refused: that key was rotated out and can no longer sign.</div>`:btn("Try to sign with the old key","rc-old")}
      <div class="next">${go("govern","Next journey: governance")}</div>`:btn("Create new passkey (simulated)","rc-done","pri")}</div>`}};

J.govern={title:"Change a network rule",sub:"Vote, timelock, execute",steps:["Proposal","Vote","Timelock","Executed"],who:()=>"okafor",
 view(s){const g=S.gov,f=212+(g.vote==="for"?1:0),a=61+(g.vote==="against"?1:0);
  const head=`<h3>Proposal 7: reveal sealed reviews after 14 days instead of 21</h3><p>Shortens the wait when a second reviewer is slow. Changes one protocol parameter.</p>`;
  if(s===0)return `<div class="card">${head}<p class="small muted">One person, one vote for verified members. Votes cannot be bought, and no vote can decide whether a specific paper is correct.</p>${btn("Open voting","gv-next","pri")}</div>`;
  if(s===1)return `<div class="card">${head}<div class="row">${btn("Vote for","gv-vote","pri",'data-d="for"')}${btn("Vote against","gv-vote","",'data-d="against"')}</div></div>`;
  if(s===2)return `<div class="card">${head}<div class="row">${chip("ok","For "+f)}${chip("plain","Against "+a)}${chip("ok","Quorum met")}</div>
    <p class="small muted" style="margin-top:8px">Tallies other than your own vote are demo figures.</p>
    <div class="banner pend" style="margin-top:10px">Passed. Waiting 7 days before it takes effect, so anyone who disagrees can leave with the full record first.</div>${btn("Skip 7 days (demo)","gv-exec","pri")}</div>`;
  return `<div class="card">${head}<div class="banner ok">Executed. Sealed reviews are now revealed after ${S.policy.revealDays} days. The Review journey shows the new value.</div>
    <div class="next">${btn("Start over","reset")}</div></div>`}};

/* ---------- actions ---------- */
const st=(j,n)=>{S.st[j]=n};
const nx=j=>{S.st[j]=Math.min(S.st[j]+1,J[j].steps.length-1)};
const A={
 goto(d){S.j=d},reset(){init()},
 "ob-passkey"(){S.user.passkey=true;nx("onboard")},
 "ob-orcid"(){S.user.orcid=true;rec("credential.orcid","orcid",{subject:did("mei"),claim:"owns an ORCID iD (simulated)"});nx("onboard")},
 "ob-cat"(d){S.user.cats[d]=!S.user.cats[d]},"ob-next"(){nx("onboard")},
 "ob-guard"(){S.user.guardians=true;nx("onboard")},
 "ob-endorse"(){S.user.endorsed=true;rec("endorsement","okafor",{endorsee:did("mei"),categories:["cs.AI","cs.LG"]})},
 "pb-demo"(){S.sub.files=demoFiles("p2");S.sub.note=""},"pb-next"(){nx("publish")},"pb-checks"(){S.sub.checks=true},
 "pb-sign"(){const b=S.sub;newPaper("p2","mei",["mei","rafael","lena"],{title:b.title.trim()||"Untitled",abstract:b.abstract.trim(),changeNote:"Initial version"},b.files,b.licence,[b.cat]);st("publish",5)},
 "pb-consent"(d){consent("p2",d);if(J.publish.ready())st("publish",6)},
 "md-pick"(d){S.mod.pick=d;S.mod.action=d==="px"?"reject":"list";S.mod.clause=d==="px"?"2.3 Not a scholarly contribution":"1.1 In scope and scholarly form";
   S.mod.reason=d==="px"?"The submission makes no testable claim and cites no prior work.":"";st("moderate",1)},
 "md-back"(){st("moderate",0)},
 "md-sign"(){const m=S.mod,p=S.papers[m.pick],r=rec("moderation.decision","priya",{target:p.versions[0],action:m.action,clause:m.clause,reason:m.reason});
   m.done[m.pick]={action:m.action,clause:m.clause,reason:m.reason,id:r.id};m.appeal=null;
   p.mod=m.action==="list"?"listed":m.action==="reject"?"rejected":"queue";
   if(m.pick==="p2"&&m.action==="list"){rec("ai.review","node",{target:p.versions[0],agents:["methodology","literature","reproducibility","integrity","meta"],promptSet:sha256("prompt-set-v1").slice(0,16)});st("publish",7)}
   st("moderate",2)},
 "md-appeal"(){S.mod.appeal=true;rec("appeal.decision","committee",{target:S.mod.done[S.mod.pick].id,outcome:"upheld",panel:"3 members drawn at random"})},
 "rv-next"(){nx("review")},"rv-anon"(d){S.rev.anon=d==="1"},
 "rv-score"(d,v){S.rev.scores[d]=+v},
 "rv-fill"(){S.rev.scores={Soundness:3,Evidence:3,Reproducibility:4,Novelty:4,Clarity:4,Limitations:3};S.rev.rec="Major concerns";
   S.rev.text="The central comparison depends on the adversarial baseline in Section 4.1, which is not specified well enough to reproduce. Please give its hyperparameters and a run with a stronger baseline.";S.rev.err=""},
 "rv-check"(){const r=S.rev;r.err=DIMS.some(d=>!r.scores[d])?"Score every dimension.":!r.rec?"Choose a recommendation.":r.text.trim().length<40?"Write a report of at least 40 characters. Free-text-only or empty reviews are not accepted as formal.":"";if(!r.err)nx("review")},
 "rv-commit"(){const r=S.rev;r.sealed={scores:r.scores,rec:r.rec,text:r.text.trim(),salt:sha256(String(Date.now())).slice(0,4)};r.commitment=sha256(canon(r.sealed));
   rec("review.commit",r.anon?"okafor-review-key":"okafor",{target:S.papers.p1.versions[0],commitment:r.commitment,nullifier:sha256("okafor-secret|"+S.papers.p1.genesis).slice(0,24)});r.committed=true},
 "rv-dup"(){S.rev.dup=true},
 "rv-reveal"(){const r=S.rev,v=S.papers.p1.versions[0];
   rec("review.formal","revA",Object.assign({target:v},S.sealedA));rec("review.formal",r.anon?"okafor-review-key":"okafor",Object.assign({target:v},r.sealed));
   S.reviews=[Object.assign({label:"Reviewer A",anon:true},S.sealedA),Object.assign({label:r.anon?"Reviewer B":"Dr. Tunde Okafor",anon:r.anon},r.sealed)];S.revealed=true;
   r.reply="Thank you. Version 2 specifies the adversarial baseline in full (new Table 3), adds a stronger baseline, and extends the limitations section."},
 "rv-reply"(){const t=S.rev.reply.trim()||"Addressed in version 2.";S.reviews.forEach(x=>x.reply=t);rec("review.response","mei",{reply:t});
   addVersion("p1","mei",{title:R(S.papers.p1.versions[0]).body.title,abstract:R(S.papers.p1.versions[0]).body.abstract,changeNote:"Baseline specified; stronger baseline added"});
   consent("p1","rafael");consent("p1","lena");S.ver.res=null;nx("review")},
 "rv-update"(){const r=S.reviews[1];if(REC.indexOf(r.rec)>1)r.rec="Sound with minor revisions";rec("review.formal",S.rev.anon?"okafor-review-key":"okafor",{target:S.papers.p1.versions[1],rec:r.rec,update:true});S.rev.updated=true},
 "ai-next"(){nx("ai-review")},"ai-set"(d,v){S.ai.state[d]=v},"ai-inj"(){S.ai.inj=true},
 "ver-open"(d){S.j="verify";S.ver={pk:d,abs:false,pdf:false,res:null};st("verify",0)},
 "ver-run"(){S.ver.res=verifyPaper(S.ver.pk);st("verify",(S.ver.abs||S.ver.pdf)?2:Math.max(S.st.verify,1))},
 "ver-abs"(){S.ver.abs=!S.ver.abs;S.ver.res=verifyPaper(S.ver.pk);st("verify",2)},
 "ver-pdf"(){S.ver.pdf=!S.ver.pdf;S.ver.res=verifyPaper(S.ver.pk);st("verify",2)},
 "nd-boot"(){const ok=S.log.filter(r=>hashOf(r)===r.id).length,good=S.anchors.filter(a=>merkle(a.ids)===a.root).length;
   S.nodeS.boot={ok,total:S.log.length,batches:good,bad:ok!==S.log.length||good!==S.anchors.length,pending:S.log.filter(r=>r.batch===null).length}},
 "nd-next"(){nx("preserve")},
 "nd-fail"(){S.nodeS.reps[2].up=false},
 "nd-probe"(){const r=S.nodeS.reps.find(x=>!x.up&&x.fails<3);if(r)r.fails++},
 "nd-rerep"(){S.nodeS.reps.push({name:"Kauri Data Commons",op:"Kauri Research Trust",jur:"NZ",up:true,fails:0})},
 "ds-flag"(){rec("flag","sam",{target:S.papers.p1.genesis,text:S.dis.text.trim()});S.papers.p1.flag=true;nx("dispute")},
 "ds-open"(){rec("integrity.case","committee",{target:S.papers.p1.genesis,state:"open"});nx("dispute")},
 "ds-resp"(){rec("case.response","mei",{text:S.dis.resp.trim()});nx("dispute")},
 "ds-decide"(){const d=S.dis,p=S.papers.p1,r=rec(d.outcome==="Retraction"?"retraction":d.outcome==="Correction required"?"correction":"case.closed","committee",{target:p.genesis,outcome:d.outcome,reasons:d.reasons.trim(),threshold:"3 of 5"});
   p.retracted=d.outcome==="Retraction";p.correction=d.outcome==="Correction required"?"Figure 5 replaced. "+d.reasons.trim():null;if(d.outcome==="No action")p.flag=null;S.ver.res=null;nx("dispute")},
 "rc-next"(){nx("recover")},"rc-ok"(d){S.rcv.ok[+d]=true},
 "rc-done"(){S.rcv.done=true;rec("key.rotation","guardians",{subject:did("mei"),newKey:did("mei-new-device"),approvals:"3 of 5"})},
 "rc-old"(){S.rcv.old=true},
 "gv-next"(){nx("govern")},"gv-vote"(d){S.gov.vote=d;nx("govern")},
 "gv-exec"(){S.policy.revealDays=14;rec("governance.execution","assembly",{proposal:7,param:"review.revealDays",value:14,timelock:"7 days"});nx("govern")},
 anchor(){anchor()}
};

/* ---------- render ---------- */
function render(){
  const j=S.j,d=J[j],s=S.st[j],w=d.who(s);
  document.querySelector("#rail").innerHTML=`<h2>User journeys</h2>`+JOURNEYS.map((k,i)=>{const done=S.st[k]===J[k].steps.length-1;
    return `<button class="jbtn ${done?"done":""}" data-a="goto" data-d="${k}" aria-current="${k===j}"><span class="jnum">${done?"✓":i+1}</span><span>${J[k].title}<span class="jsub">${J[k].sub}</span></span></button>`}).join("")+
    `<button class="btn reset" data-a="reset">Reset the demo</button>`;
  document.querySelector("#main").innerHTML=`<div class="jhead"><h1>${d.title}</h1><span class="who">Acting as <b>${esc(nm(w))}</b> · ${esc(PEOPLE[w].role)}</span></div>
    <ol class="steps">${d.steps.map((x,i)=>`<li class="${i<s?"ok":i===s?"cur":""}">${i+1}. ${x}</li>`).join("")}</ol>${d.view(s)}
    <p class="foot">Prototype for discussion. People, papers, tallies and check results are invented. Nothing is uploaded or sent.</p>`;
  const pend=S.log.filter(r=>r.batch===null).length,la=S.anchors[S.anchors.length-1];
  document.querySelector("#log").innerHTML=`<h2>Signed record log</h2>
    <div class="small muted">${S.log.length} records · ${S.anchors.length} anchor batch(es)${pend?" · "+pend+" not yet anchored":""}</div>
    <div class="row" style="margin-top:8px">${btn("Anchor batch now","anchor","",pend?"":"disabled")}</div>
    ${la?`<div class="small muted" style="margin-top:6px">Latest root <span class="mono">${short(la.root)}</span></div>`:""}
    <div class="entries">${S.log.slice().reverse().map(r=>`<div class="entry ${r.id===S.fresh?"new":""}"><div class="t">${esc(r.type)}</div>
      <div class="m">${esc(PEOPLE[r.by]?nm(r.by):"Anonymous review key")} · <span class="mono">${short(r.id)}</span> · ${r.batch?"batch "+r.batch:"pending"}</div></div>`).join("")}</div>`;
  try{if(location.hash.slice(1)!==j)location.hash=j}catch(e){}
}
document.addEventListener("click",e=>{const b=e.target.closest("[data-a]");if(!b||b.disabled)return;
  const f=A[b.dataset.a];if(!f)return;f(b.dataset.d,b.dataset.v);const y=window.scrollY;render();window.scrollTo(0,y)});
document.addEventListener("input",e=>{const k=e.target.dataset&&e.target.dataset.b;if(!k)return;const [a,b]=k.split(".");S[a][b]=e.target.value});
document.addEventListener("change",e=>{if(e.target.id!=="filein")return;
  const fs=Array.from(e.target.files||[]);if(!fs.length)return;S.sub.note="";
  Promise.all(fs.map(f=>f.size>26214400?Promise.resolve(null):f.arrayBuffer().then(buf=>({path:f.name,size:(f.size/1048576).toFixed(2)+" MB",role:"file",fp:sha256Bytes(new Uint8Array(buf))}))))
    .then(out=>{const ok=out.filter(Boolean);if(ok.length<out.length)S.sub.note="Files over 25 MB were skipped in this prototype.";if(ok.length)S.sub.files=ok;render()})
    .catch(()=>{S.sub.note="That file could not be read. Try the demo files.";render()})});
window.addEventListener("hashchange",()=>{const h=location.hash.slice(1);if(J[h]&&h!==S.j){S.j=h;render()}});
init();
(function(){const h=(typeof location!=="undefined"&&location.hash||"").slice(1);if(J[h])S.j=h})();
render();
</script>
</body>
</html>
